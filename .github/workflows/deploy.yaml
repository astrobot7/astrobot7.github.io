name: Deploy Hugo Site to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # Hugo 0.170 removed LibSass and the extended edition; the LoveIt theme
          # compiles its SCSS with toCSS, which then needs Dart Sass on PATH.
          # Pinned to the last version that builds the site as is.
          hugo-version: '0.169.0'
          extended: true

      - name: Build Static Files
        run: hugo --minify

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          cname: blog.aswinkm.dev
